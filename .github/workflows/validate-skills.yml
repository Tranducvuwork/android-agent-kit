name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    # The kit claims Python 3.9+, so the floor is tested too. 3.9 is no longer
    # available on ubuntu-latest, hence the pinned runner for that leg.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.9'
          - os: ubuntu-latest
            python: '3.12'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Validate every skill package
        run: python3 -I scripts/validate-skills.py

      - name: Packaged docs match their sources
        run: python3 -I scripts/prepare-skill.py --check

      - name: Install pytest
        run: python3 -m pip install --quiet pytest

      - name: Coverage, evidence and packaging tests
        run: python3 -m pytest tests -q

      - name: Installer dry run against a scratch project
        run: |
          mkdir -p /tmp/scratch-project
          python3 -I scripts/install-skills.py /tmp/scratch-project --dry-run
