name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Validate every skill package
        run: python3 -I scripts/validate-skills.py

      - name: Packaged docs match their sources
        run: python3 -I scripts/prepare-skill.py --check

      - name: Installer dry run against a scratch project
        run: |
          mkdir -p /tmp/scratch-project
          python3 -I scripts/install-skills.py /tmp/scratch-project --dry-run
